<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Communauté d'entraide entre joueurs : missions, astuces, vidéos et carte interactive.">
<link rel="manifest" href="manifest.webmanifest">

<title>Complice – prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE9F2;--card:#fff;--ink:#2A1450;--mute:#6B4C8F;--line:#F3C6DB;--pink:#FF2E88;--orange:#FF8A3D;--sun:#FFD166;--cyan:#0AA7A0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B0B33;--card:#2A1450;--ink:#FFF4E8;--mute:#C9B3E6;--line:#4A2A7A;--cyan:#19E3D8}}
:root[data-theme="dark"]{--bg:#1B0B33;--card:#2A1450;--ink:#FFF4E8;--mute:#C9B3E6;--line:#4A2A7A;--cyan:#19E3D8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.pad{padding:0 16px}
.hero{position:relative;margin-bottom:14px}.hero svg{display:block;width:100%;height:190px}
.hero h1{position:absolute;left:16px;bottom:34px;margin:0;font:400 38px/1 "Titan One",Impact,sans-serif;color:#fff;text-shadow:3px 3px 0 #FF2E88}
.hero p{position:absolute;left:16px;bottom:10px;margin:0;color:#fff;font-weight:700;font-size:14px}
h2{font:400 22px/1.1 "Titan One",Impact,sans-serif;margin:18px 0 10px}
h3{font-size:17px;font-weight:700;margin:0 0 4px}
p{margin:0 0 8px}.mute{color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer;color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.mission{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.num{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 18px "Titan One",Impact,sans-serif;color:#fff;background:var(--c)}
.mission>div{flex:1}.go{color:var(--mute);font-size:22px}
.chip{display:inline-block;border:2px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;margin:0 6px 8px 0}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;background:var(--line);color:var(--ink)}
.tag.exp{background:var(--cyan);color:#14213D}
.tag.lvl{background:var(--c);color:#14213D}
.btn{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;box-shadow:0 4px 0 #A8195B}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #A8195B}
.btn.alt{background:var(--sun);color:#2A1450;box-shadow:0 4px 0 #C9962A}
.back{background:none;border:0;color:var(--mute);padding:8px 0}
input[type=text]{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--pink);color:#fff}
.ans{border-left:5px solid var(--line);padding-left:10px;margin-top:12px}.ans.x{border-left-color:var(--cyan)}
.vote{border:1px solid var(--line);background:transparent;border-radius:12px;padding:4px 10px;min-width:54px;font-weight:700}
.vote.on{background:var(--orange);border-color:var(--orange);color:#2A1450}
.row{display:flex;gap:10px;align-items:flex-start}.row>div{flex:1}
.gate{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px}
.gate .blur{filter:blur(8px);user-select:none;padding:14px;background:var(--card);border:1px solid var(--line);min-height:150px}
.gate .over{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(27,11,51,.6);padding:12px;text-align:center}
.stamp{font:400 30px "Titan One",Impact,sans-serif;color:var(--sun);transform:rotate(-5deg);border:4px solid var(--sun);padding:0 14px;border-radius:10px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;margin-bottom:10px}
.bub.u{background:var(--pink);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bub.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.stars{font-size:30px;letter-spacing:4px;color:var(--line)}.stars b{color:var(--sun);font-weight:400}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}
.badge{opacity:.4}.badge.got{opacity:1;background:var(--sun);color:#2A1450}
.share{background:linear-gradient(160deg,#3B1470,#FF2E88 60%,#FF8A3D);color:#fff;border-radius:22px;padding:24px;text-align:center;margin-bottom:12px}
.share b{font:400 30px "Titan One",Impact,sans-serif;display:block;margin:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:430px}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 4px 8px;font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
nav button.on{color:var(--pink)}nav button.on svg{fill:var(--pink)}
.thumb{position:relative;height:120px;border-radius:14px;display:grid;place-items:center;font-size:38px;color:#fff;margin-bottom:10px}
.src{position:absolute;top:8px;left:8px;font-size:12px;font-weight:700;background:rgba(0,0,0,.45);border-radius:999px;padding:1px 10px}
.act{background:none;border:0;color:var(--mute);font-weight:700;padding:6px 12px 6px 0}.act.on{color:var(--pink)}
.lad{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
:root{--glass:rgba(255,255,255,.55);--gline:rgba(255,255,255,.75);--ind:rgba(255,46,136,.16);--th:calc(52px + env(safe-area-inset-top,0px));padding-top:0;padding-bottom:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(60,28,110,.45);--gline:rgba(255,255,255,.18);--ind:rgba(255,255,255,.16)}}
:root[data-theme="dark"]{--glass:rgba(60,28,110,.45);--gline:rgba(255,255,255,.18);--ind:rgba(255,255,255,.16)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
#ph{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;background:radial-gradient(circle at 12% 6%,rgba(255,46,136,.32),transparent 42%),radial-gradient(circle at 92% 34%,rgba(25,227,216,.22),transparent 40%),radial-gradient(circle at 18% 82%,rgba(255,138,61,.28),transparent 42%),var(--bg);background-attachment:local}
@media (min-width:600px){body{display:grid;place-items:center;background:#0D0618}#ph{position:relative;inset:auto;width:390px;height:min(844px,94vh);border:10px solid #000;border-radius:48px}}
#top{position:sticky;top:0;z-index:10;flex:none;height:var(--th);margin-bottom:calc(var(--th)*-1);padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border-bottom:1px solid transparent;transition:border-color .3s}
#top.sc{border-bottom-color:var(--gline)}
#tt{margin:0;font:700 17px "DM Sans",system-ui,sans-serif;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#tt.in{animation:ttin .4s ease both}
@keyframes ttin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#bk{position:absolute;left:4px;bottom:0;width:48px;height:52px;background:none;border:0;font-size:34px;line-height:1;color:var(--pink)}
#app{max-width:none;margin:0;min-height:0;flex:1 0 auto;padding-bottom:12px}
#app.in{animation:pin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pin{from{opacity:0;transform:translateX(calc(var(--dx)*30px)) scale(.97);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.hero svg{height:180px}.hero h1,.hero p{display:none}.back{display:none}
.card,.seg,.bub.a{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border:1px solid var(--gline);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 24px rgba(42,20,80,.12)}
.mission,.chip,.act,.vote{transition:transform .15s}.mission:active,.chip:active,.act:active,.vote:active,.seg button:active{transform:scale(.96)}
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;margin:0;padding:8px 16px}
nav{position:sticky;left:auto;right:auto;bottom:0;flex:none;z-index:10;margin:0 14px calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--gline);border-radius:30px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 10px 30px rgba(0,0,0,.25)}
#tabs{position:relative;padding:4px;max-width:none}
#tabs button{position:relative;z-index:1;padding:8px 2px 6px;min-height:56px}
#ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:26px;background:var(--ind);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 12px rgba(255,46,136,.28);transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
@media (prefers-reduced-motion:reduce){#app.in,#tt.in{animation:none}#ind{transition:none}#ph{scroll-behavior:auto}}
input[type=date],input[type=number]{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;margin-bottom:10px}
.err{color:var(--pink);font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;margin:12px 0}.chk input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--pink)}
.dots{display:flex;gap:6px;margin:0 0 20px}.dots i{flex:1;height:5px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--pink)}
#ph.ob #top,#ph.ob nav{display:none}
#ind{width:calc((100% - 8px)/5)}#tabs button{font-size:11px;padding:8px 0 6px}
.cms{margin-top:8px}.cm{border-top:1px solid var(--line);padding:8px 0}
.mapw{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--gline);aspect-ratio:10/11;background:#0E5C7E;box-shadow:0 8px 24px rgba(42,20,80,.2)}
#msv{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mz{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.mz button{width:44px;height:44px;border-radius:50%;border:1px solid var(--gline);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:24px;font-weight:700;color:var(--ink)}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;margin:0!important}
.av{display:inline-block;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;border:2px solid var(--gline);background:var(--card)}
.av.ph{background:var(--pink);color:#fff;text-align:center;font-weight:700}
.pa{border:3px solid transparent;border-radius:50%;padding:2px;background:none}.pa.on{border-color:var(--pink)}.pa .av{margin:0;display:block}
.grid{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="tabs"></div></nav>
<script>
var M=[
{id:1,t:"Braquage de la banque",d:1,s:"Repère la sortie de secours avant d'entrer. Garde la voiture moteur allumé et évite de tirer en premier : la police arrive plus lentement."},
{id:2,t:"Course de nuit",d:2,s:"Prends les virages larges dans la zone du port. Utilise le raccourci sous le pont au deuxième tour."},
{id:3,t:"Poursuite sur l'autoroute",d:3,s:"Change de voie avant les péages. Un véhicule lourd bloque les poursuivants si tu le dépasses juste avant la sortie."}];
var Q=[
{id:1,m:1,q:"Je me fais repérer dès l'entrée, comment faire ?",a:[{by:"Nora",x:1,t:"Entre par la porte latérale et attends que le garde passe. Ça marche à tous les coups.",v:21}]},
{id:2,m:1,q:"Où trouver la sortie de secours ?",a:[{by:"Karim",x:0,t:"Derrière l'escalier, côté gauche du hall.",v:4}]},
{id:3,m:2,q:"Impossible de gagner la course, des conseils ?",a:[{by:"Lina",x:1,t:"Le raccourci sous le pont fait gagner 5 secondes. Prends-le au deuxième tour.",v:17}]},
{id:4,m:3,q:"Comment semer la police sur l'autoroute ?",a:[{by:"Sam",x:1,t:"Dépasse un camion juste avant la sortie, il bloque les voitures derrière toi.",v:14}]}];
var DL=["Facile","Moyen","Difficile"],DC=["#19E3D8","#FF8A3D","#FF2E88"];
var S={tab:"m",mid:null,seg:"s",f:0,ok:{},vt:{},chat:[],share:false};
var IC={m:'<path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',q:'<path d="M4 5h16v11H9l-5 4z"/>',i:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',p:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2-5.5-3-5.5 3 1-6.2L3 9.7l6.2-.9z"/>'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hero(){var p='<path d="M0 190 L0 150 C20 120 40 118 55 150 L60 190z" fill="#1B0B33"/>';
return '<div class="hero"><svg viewBox="0 0 430 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B1470"/><stop offset=".55" stop-color="#FF2E88"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs><rect width="430" height="190" fill="url(#g)"/><circle cx="300" cy="100" r="56" fill="#FFD166"/><g fill="#FF5A6E"><rect x="236" y="104" width="128" height="4"/><rect x="236" y="116" width="128" height="6"/><rect x="236" y="130" width="128" height="8"/></g><rect y="150" width="430" height="40" fill="#1B0B33"/><g fill="#1B0B33"><path d="M370 190 Q380 120 392 82 L397 83 Q388 125 384 190z"/><path d="M394 84 Q370 62 346 76 Q372 66 394 84z"/><path d="M394 84 Q420 60 440 80 Q416 68 394 84z"/><path d="M394 84 Q384 56 360 50 Q388 54 394 84z"/><path d="M394 84 Q406 56 430 52 Q404 56 394 84z"/><path d="M60 190 Q66 140 74 112 L78 113 Q72 145 72 190z"/><path d="M76 114 Q58 98 38 108 Q60 102 76 114z"/><path d="M76 114 Q96 96 116 108 Q94 102 76 114z"/></g></svg><h1>Complice</h1><p>Les experts aident les novices</p></div>'}
function lvl(d){return '<span class="tag lvl" style="--c:'+DC[d-1]+'">'+DL[d-1]+'</span>'}
function mlist(){var q=(document.getElementById("sq")||{}).value||"";q=q.toLowerCase();return M.filter(function(m){return(!S.f||m.d==S.f)&&m.t.toLowerCase().indexOf(q)>-1}).map(function(m){return '<button class="card mission" data-a="open" data-id="'+m.id+'"><span class="num" style="--c:'+DC[m.d-1]+'">'+m.id+'</span><div><h3>'+esc(m.t)+'</h3>'+lvl(m.d)+' <span class="mute">'+Q.filter(function(x){return x.m==m.id}).length+' questions</span></div><span class="go">›</span></button>'}).join('')||'<p class="mute">Aucune mission trouvée. Essaie un autre filtre.</p>'}
function vM(){return hero()+'<div class="pad"><input type="text" id="sq" placeholder="Chercher une mission" aria-label="Chercher une mission">'+["Toutes"].concat(DL).map(function(l,i){return '<button class="chip'+(S.f==i?' on':'')+'" data-a="f" data-id="'+i+'">'+l+'</button>'}).join('')+'<div id="ml">'+mlist()+'</div></div>'}
function qc(q,show){return '<div class="card"><h3>'+esc(q.q)+'</h3>'+(show?'<p class="mute">'+esc(M[q.m-1].t)+'</p>':'')+(q.a.length?q.a.map(function(a){return '<div class="ans'+(a.x?' x':'')+'"><div class="row"><div><span class="tag'+(a.x?' exp':'')+'">'+esc(a.by)+(a.x?' · Expert':'')+'</span><p style="margin-top:6px">'+esc(a.t)+'</p></div><button class="vote'+(S.vt[q.id]?' on':'')+'" data-a="vote" data-id="'+q.id+'" aria-label="Voter pour cette réponse">▲ '+(a.v+(S.vt[q.id]?1:0))+'</button></div></div>'}).join(''):'<p class="mute">Pas encore de réponse. Un expert va t\'aider.</p>')+'</div>'}
function vD(){var m=M[S.mid-1],n=Q.filter(function(q){return q.m==m.id}),b='<div class="card"><h3>Astuces</h3><p>'+esc(m.s)+'</p></div>';
var h='<div class="pad"><button class="back" data-a="home">‹ Missions</button><h2 style="margin-top:0">'+esc(m.t)+'</h2>'+lvl(m.d)+'<div class="seg"><button class="'+(S.seg=="s"?'on':'')+'" data-a="seg" data-id="s">Astuces</button><button class="'+(S.seg=="q"?'on':'')+'" data-a="seg" data-id="q">Questions ('+n.length+')</button></div>';
if(S.seg=="s")h+=S.ok[m.id]?b:'<div class="gate"><div class="blur">'+b+'</div><div class="over"><div class="stamp">SPOILER</div><p style="margin:0;color:#fff">Ces astuces révèlent la mission.</p><button class="btn" data-a="ok" data-id="'+m.id+'">Je veux continuer quand même</button></div></div>';
else h+=n.map(function(q){return qc(q)}).join('')+'<input type="text" id="nq" placeholder="Pose ta question à la communauté"><button class="btn" data-a="ask">Publier ma question</button>';return h+'</div>'}
function vQ(){return '<div class="pad"><h2>Questions</h2>'+Q.map(function(q){return qc(q,1)}).join('')+'</div>'}
function vI(){var h='<div class="pad"><h2>Assistant</h2><p class="mute">Il répond à partir des réponses des joueurs.</p>';
if(!S.chat.length)h+='<p>Essaie :</p>'+["Comment semer la police ?","Où est la sortie de secours ?","Un conseil pour la course"].map(function(t){return '<button class="chip" data-a="sug" data-t="'+t+'">'+t+'</button>'}).join('');
h+=S.chat.map(function(c){return c.u?'<div class="bub u">'+esc(c.u)+'</div>':'<div class="bub a">'+(c.none?'Je n\'ai pas encore de réponse sur ce sujet. Pose ta question à la communauté, un expert te répondra.':esc(c.a.t)+'<p class="mute" style="margin:6px 0 0">Source : '+esc(c.a.by)+(c.a.x?' (Expert)':'')+', sur « '+esc(c.q.q)+' »</p>')+'</div>'}).join('');
return h+'<input type="text" id="aq" placeholder="Pose ta question" style="margin-top:8px"><button class="btn" data-a="ai">Envoyer</button></div>'}
function vP(){var B=[["Premier pas",1],["Utile",1],["Expert",0],["Parrain",0]];
